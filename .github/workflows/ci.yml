name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Format check
        run: npm run format --silent
      - name: Lint
        run: npx eslint "src/**/*.{js,jsx,css,html}" || true
      - name: Build
        run: npm run build
